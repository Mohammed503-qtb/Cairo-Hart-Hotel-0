name: Mobile CI

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

jobs:
  analyze-test:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  build-smoke:
    name: Android build smoke (dev flavor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build debug APK (dev flavor)
        run: flutter build apk --debug --flavor dev --dart-define=APP_ENV=dev

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7
